<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Halliday SFL Analyst</title>
  <desc id="desc">Meaning choices, congruent alternatives, and verifiable sources across ideational, interpersonal, textual, and Chinese SFL analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2b"/>
      <stop offset="0.58" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#14324a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f1c75b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#a7c7df" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <path d="M0 335 C210 270 310 397 525 320 S920 238 1280 328 V420 H0Z" fill="#2dd4bf" opacity="0.055"/>

  <g transform="translate(94 76)">
    <text x="0" y="28" fill="#8ae7da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3">SYSTEMIC FUNCTIONAL LINGUISTICS</text>
    <text x="0" y="104" fill="#f5f8fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="64" font-weight="760" letter-spacing="-2">Halliday SFL Analyst</text>
    <rect x="0" y="127" width="600" height="4" rx="2" fill="url(#line)"/>
    <text x="0" y="177" fill="#c7d8e6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="24">Meaning choices. Congruent alternatives. Verifiable sources.</text>

    <g transform="translate(0 226)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1">
      <g><rect width="150" height="38" rx="19" fill="#2dd4bf" opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.55"/><text x="75" y="24" text-anchor="middle" fill="#87f0df">IDEATIONAL</text></g>
      <g transform="translate(164 0)"><rect width="178" height="38" rx="19" fill="#60a5fa" opacity="0.14" stroke="#60a5fa" stroke-opacity="0.55"/><text x="89" y="24" text-anchor="middle" fill="#a9d0ff">INTERPERSONAL</text></g>
      <g transform="translate(356 0)"><rect width="142" height="38" rx="19" fill="#f1c75b" opacity="0.14" stroke="#f1c75b" stroke-opacity="0.55"/><text x="71" y="24" text-anchor="middle" fill="#ffe39b">TEXTUAL</text></g>
      <g transform="translate(512 0)"><rect width="128" height="38" rx="19" fill="#c084fc" opacity="0.14" stroke="#c084fc" stroke-opacity="0.55"/><text x="64" y="24" text-anchor="middle" fill="#ddb8ff">中文 SFL</text></g>
    </g>
  </g>

  <g transform="translate(1030 210)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="124" stroke="#b8d3e5" stroke-opacity="0.12"/>
    <circle r="88" stroke="#b8d3e5" stroke-opacity="0.17"/>
    <circle r="8" fill="#f5f8fb" stroke="none" filter="url(#glow)"/>

    <path d="M0 0 L-74 -48 M0 0 L81 -35 M0 0 L18 90" stroke="url(#line)" stroke-width="3" opacity="0.85"/>
    <circle cx="-74" cy="-48" r="13" fill="#2dd4bf" stroke="#b2fff5" stroke-width="2"/>
    <circle cx="81" cy="-35" r="13" fill="#60a5fa" stroke="#c3ddff" stroke-width="2"/>
    <circle cx="18" cy="90" r="13" fill="#f1c75b" stroke="#fff0bd" stroke-width="2"/>

    <path d="M-74 -48 C-30 -112 56 -101 81 -35" stroke="#c084fc" stroke-opacity="0.52" stroke-width="2" stroke-dasharray="5 8"/>
    <path d="M81 -35 C111 38 82 82 18 90" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 8"/>
    <path d="M18 90 C-72 84 -111 30 -74 -48" stroke="#f1c75b" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 8"/>
  </g>
</svg>

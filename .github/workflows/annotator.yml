name: Annotation app
on:
  push:
    paths: ['apps/annotator/**', '.github/workflows/annotator.yml']
  pull_request:
    paths: ['apps/annotator/**', '.github/workflows/annotator.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/annotator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/annotator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
